<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Enterprise Micro Frontend Template">
  <title>Enterprise Micro Frontend</title>
  <style>
    #root {
      height: 100vh;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 16px;
      color: #666;
    }

    .micro-app-container {
      height: 100%;
    }
  </style>
  <!-- 全局共享基础依赖库 (CDN / 静态资源) -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/vue@2.7.16/dist/vue.runtime.min.js"></script>
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="root">
    <div class="loading">Loading...</div>
    <!-- 微应用容器 -->
    <div id="micro-app-container" class="micro-app-container"></div>
  </div>

</body>
</html>
